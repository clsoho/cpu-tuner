name: Release

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Bump version
        id: version
        shell: bash
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="0.1.0"
          else
            MAJOR=$(echo "$LATEST_TAG" | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST_TAG" | sed 's/v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST_TAG" | sed 's/v//' | cut -d. -f3)
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          jq ".version = \"$NEW_VERSION\"" src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Build & Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "CPU Tuner v__VERSION__"
          releaseBody: |
            ## CPU Tuner v__VERSION__

            ### 主面板 — Main
            - 逐核心实时监控：C0% / 温度 / 频率 / 倍频 / VID 电压
            - Set Multiplier — 手动锁定 CPU 倍频
            - Clock Modulation — 时钟调制滑块
            - SpeedStep / Speed Shift / C1E / BD PROCHOT / Turbo 开关
            - Speed Shift EPP 调节（0–255）
            - 4 种性能配置文件一键切换

            ### FIVR — 电压调节
            - Core / Cache / GPU / System Agent 电压偏移（-250 ~ +250 mV）
            - 快速预设按钮

            ### TPL — 功率限制
            - PL1 / PL2 功耗限制
            - Turbo Time Window 设置
            - MMIO Lock / Sync MMIO
            - 场景预设：Laptop / Balanced / Performance / Unlimited

            ### Bench — CPU 基准测试
            - 多线程基准测试，可配置线程与迭代次数

            ### Options — 全局设置
            - 配置文件编辑
            - 最小化到系统托盘 / 开机自启 / 启动自动应用
            - 温度告警
            - 插入/断开电源自动切换配置

            ### 📦 安装方式
            - **MSI 安装包** — 双击安装（推荐）
            - **EXE 绿色版** — 下载即用

            ### ⚠️ 注意
            - 仅支持 **Windows 10/11**
            - 部分功能需要 **管理员权限**
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
